<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1F3A">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="icon" href="../assets/icon.png">

  <title>Reset password | STUDX</title>
</head>
<body>
<header id="siteHeader"></header>
<main class="page">
  <h1>Reset your password</h1>
  <p class="sub">Enter your school email and we'll send a reset link.</p>
  <form id="resetForm" novalidate>
    <div class="field"><label for="email">School email</label><input id="email" type="email" autocomplete="email"></div>
    <p class="form-msg" role="alert"></p>
    <button class="btn btn-primary btn-lg" type="submit">Send reset link</button>
  </form>
  <p class="alt-link"><a href="login.html">Back to log in</a></p>
</main>
<script type="module">
import { renderHeader, handleSubmit } from "../../js/ui.js";
import { sendReset } from "../../js/auth.js";
renderHeader();
const form = document.getElementById("resetForm");
form.addEventListener("submit", e => {
  e.preventDefault();
  handleSubmit(form, async () => {
    const email = document.getElementById("email").value;
    if (!email) throw { userMessage: "Enter your email address." };
    try { await sendReset(email); } catch (err) { if (err.code !== "auth/user-not-found") throw err; }
    // Same message either way so nobody can check which emails have accounts.
    const msg = form.querySelector(".form-msg");
    msg.textContent = "If an account exists for that email, a reset link is on its way."; msg.classList.add("ok");
  });
});
</script></body></html>
